name: Flutter CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build Release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (Linter)
        run: flutter analyze

      - name: Build Lightweight Release APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: zc-pos-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
